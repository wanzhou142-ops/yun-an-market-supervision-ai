<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找茬图片尺寸对照 · 模拟药店</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a1628;
      color: #eaf4ff;
      min-height: 100vh;
    }
    .hint {
      padding: 14px 24px;
      background: rgba(54, 197, 240, 0.12);
      border-bottom: 1px solid rgba(54, 197, 240, 0.25);
      font-size: 15px;
      line-height: 1.6;
    }
    .hint strong { color: #36c5f0; }
    .tabs {
      display: flex;
      gap: 10px;
      padding: 16px 24px 0;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(8,20,39,0.6);
      color: rgba(234,244,255,0.85);
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active {
      background: #36c5f0;
      border-color: #36c5f0;
      color: #06243b;
      font-weight: 700;
    }
    .screen {
      position: relative;
      width: 100vw;
      height: calc(100vh - 120px);
      overflow: hidden;
      background:
        linear-gradient(rgba(8,20,39,0.55), rgba(8,20,39,0.72)),
        url("/pharmacy-quiz/images/image1.jpeg") center/cover no-repeat;
    }
    .crumb {
      position: absolute;
      top: 18px;
      right: 24px;
      font-size: 14px;
      color: rgba(234,244,255,0.7);
      z-index: 5;
    }
    .crumb em { color: #36c5f0; font-style: normal; }
    .left-panel {
      position: absolute;
      inset: 0;
      right: 18%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 2vw 100px 4vw;
    }
    .quiz-frame {
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(8,20,39,0.72);
      box-shadow: 0 12px 40px rgba(0,0,0,0.38);
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: width 0.35s ease, max-width 0.35s ease;
    }
    .quiz-image-shell {
      border-radius: 12px;
      overflow: hidden;
      background: #0a1628;
      line-height: 0;
      width: 100%;
    }
    .quiz-image-shell img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .quiz-label {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 600;
      color: rgba(234,244,255,0.88);
      text-align: center;
    }
    .size-badge {
      position: absolute;
      top: 18px;
      left: 24px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(8,20,39,0.85);
      border: 1px solid rgba(54,197,240,0.35);
      font-size: 13px;
      z-index: 5;
    }
    .avatar-placeholder {
      position: absolute;
      right: 2vw;
      bottom: 80px;
      width: 14vw;
      min-width: 120px;
      max-width: 200px;
      aspect-ratio: 3/4;
      border-radius: 16px;
      border: 2px dashed rgba(54,197,240,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(234,244,255,0.5);
      text-align: center;
      padding: 8px;
    }
    /* 三档预设 */
    .screen[data-size="s"] .quiz-frame { width: min(52vw, 820px); }
    .screen[data-size="s"] .quiz-image-shell img { max-height: min(58vh, 640px); }
    .screen[data-size="m"] .quiz-frame { width: min(62vw, 980px); }
    .screen[data-size="m"] .quiz-image-shell img { max-height: min(66vh, 740px); }
    .screen[data-size="l"] .quiz-frame { width: min(78vw, 1280px); }
    .screen[data-size="l"] .quiz-image-shell img { max-height: min(80vh, 920px); }
    .legend {
      position: absolute;
      bottom: 16px;
      left: 24px;
      font-size: 12px;
      color: rgba(234,244,255,0.55);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="hint">
    <strong>用法：</strong>点击下方按钮切换三档尺寸，对照数字人区域（右侧虚线框）看是否合适。
    选定后告诉我 <strong>小 / 中 / 大</strong>（或具体 vw/vh 数值），我再改正式代码。
  </div>
  <div class="tabs">
    <button class="tab" data-size="s">小 · 52vw × 58vh（推荐偏保守）</button>
    <button class="tab active" data-size="m">中 · 62vw × 66vh（折中）</button>
    <button class="tab" data-size="l">大 · 78vw × 80vh（当前正式版）</button>
  </div>
  <div class="screen" data-size="m" id="screen">
    <div class="size-badge" id="badge">中档：宽 62vw，高上限 66vh</div>
    <div class="crumb">模拟药店 · 传统药房 · 药品区 · <em>找茬练习</em></div>
    <div class="left-panel">
      <div class="quiz-frame">
        <div class="quiz-image-shell">
          <img src="/pharmacy-quiz/images/image1.jpeg" alt="找茬示例图" />
        </div>
        <p class="quiz-label">找茬练习 · 药品区 · 第 1/3 题</p>
      </div>
    </div>
    <div class="avatar-placeholder">数字人<br/>约 16–18% 宽</div>
    <div class="legend">背景与图片均为真实素材，仅框尺寸为示意</div>
  </div>
  <script>
    const labels = {
      s: "小档：宽 52vw，高上限 58vh",
      m: "中档：宽 62vw，高上限 66vh",
      l: "大档：宽 78vw，高上限 80vh（当前正式版）",
    };
    const screen = document.getElementById("screen");
    const badge = document.getElementById("badge");
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const size = btn.dataset.size;
        screen.dataset.size = size;
        badge.textContent = labels[size];
      });
    });
  </script>
</body>
</html>
